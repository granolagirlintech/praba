<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Praba</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&display=swap');

  :root{
    --pink: #ff6f9c;
    --pink-deep: #e0507a;
    --pink-soft: #ffd6e5;
    --yellow: #ffc94d;
    --yellow-soft: #fff0c6;
    --cream: #fffaf3;
    --ink: #4a3b3f;
    --ink-soft: #9a8286;
    --tape-yellow: rgba(255,201,77,0.6);
    --tape-pink: rgba(255,111,156,0.5);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    font-family: 'Kalam', cursive;
    background: radial-gradient(circle at 50% 20%, #fff4f7 0%, var(--cream) 55%, #fdf0e6 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 24px;
  }

  /* subtle paper grain, tactile handmade feel */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.05;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ambient drifting doodles: stars, hairclips, ribbon bows */
  .sparkle{
    position: fixed;
    top: 100%;
    pointer-events: none;
    opacity: 0.7;
    animation: drift linear infinite;
    z-index: 0;
  }
  @keyframes drift{
    0%{ transform: translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.7; }
    90%{ opacity:0.4; }
    100%{ transform: translateY(-115vh) rotate(200deg); opacity:0; }
  }

  .card{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    min-height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage{
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: rise 0.6s ease both;
  }
  .stage.active{ display: flex; }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- STAGE 1: ENVELOPE ---------- */
  .envelope-label{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--pink-deep);
    margin-bottom: 26px;
    transform: rotate(-2deg);
  }
  .envelope-wrap{
    position: relative;
    transform: rotate(-2.5deg);
  }
  .washi{
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    width: 84px;
    height: 26px;
    background: repeating-linear-gradient(45deg, var(--tape-yellow), var(--tape-yellow) 6px, rgba(255,255,255,0.35) 6px, rgba(255,255,255,0.35) 12px);
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    z-index: 4;
  }
  .envelope{
    position: relative;
    width: 260px;
    height: 170px;
    cursor: pointer;
  }
  .env-body{
    position: absolute;
    inset: 0;
    background: var(--pink-soft);
    border-radius: 4px 10px 6px 12px;
    box-shadow: 0 14px 30px rgba(224,80,122,0.25);
    overflow: hidden;
  }
  .env-body::before,
  .env-body::after{
    content: "";
    position: absolute;
    bottom: 0;
    width: 0; height: 0;
    border-style: solid;
  }
  .env-body::before{
    left: 0;
    border-width: 0 0 90px 130px;
    border-color: transparent transparent rgba(255,255,255,0.35) transparent;
  }
  .env-body::after{
    right: 0;
    border-width: 90px 130px 0 0;
    border-color: transparent transparent transparent rgba(255,255,255,0.2);
  }
  .env-flap{
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 130px solid transparent;
    border-right: 130px solid transparent;
    border-top: 95px solid var(--pink);
    transform-origin: top center;
    transition: transform 0.65s cubic-bezier(.6,-0.28,.74,.05);
    z-index: 3;
  }
  .envelope.open .env-flap{
    transform: rotateX(180deg);
  }
  .env-letter{
    position: absolute;
    left: 18px; right: 18px;
    bottom: 10px;
    height: 120px;
    background: var(--cream);
    border-radius: 3px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: 1.7rem;
    color: var(--pink-deep);
    transition: transform 0.7s ease 0.15s, opacity 0.7s ease 0.15s;
    z-index: 2;
    padding: 12px;
    transform: rotate(1.5deg);
  }
  .envelope.open .env-letter{
    transform: translateY(-58px) rotate(1.5deg);
  }
  .envelope-hint{
    margin-top: 22px;
    font-family: 'Caveat', cursive;
    font-size: 1.05rem;
    color: var(--ink-soft);
  }

  /* ---------- STAGE 2: HEART CURVE ---------- */
  #heart-svg{ width: 280px; height: 280px; }
  .heart-letter{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 30px;
    fill: var(--pink-deep);
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform: translateY(6px);
  }
  .heart-letter.show{ opacity: 1; transform: translateY(0); }

  /* hand-circled buttons instead of generic pills */
  .doodle-btn{
    margin-top: 20px;
    border: 2.5px solid var(--pink-deep);
    background: transparent;
    color: var(--pink-deep);
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 9px 24px;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px) rotate(-1.5deg);
    transition: opacity 0.5s ease, transform 0.25s ease, background 0.2s ease;
  }
  .doodle-btn.show{ opacity: 1; transform: translateY(0) rotate(-1.5deg); }
  .doodle-btn:hover{ background: var(--pink-soft); transform: rotate(0deg); }

  /* ---------- STAGE 3: FLOWERS ---------- */
  .message-paper{
    position: relative;
    background: var(--cream);
    padding: 22px 22px 18px;
    border-radius: 3px;
    box-shadow: 0 10px 24px rgba(224,80,122,0.15);
    transform: rotate(-1deg);
    max-width: 340px;
  }
  .washi-corner{
    position: absolute;
    top: -12px;
    right: 18px;
    width: 60px;
    height: 22px;
    background: repeating-linear-gradient(45deg, var(--tape-pink), var(--tape-pink) 6px, rgba(255,255,255,0.35) 6px, rgba(255,255,255,0.35) 12px);
    transform: rotate(6deg);
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
  }
  .message{
    font-family: 'Kalam', cursive;
    font-size: 1.25rem;
    line-height: 1.6;
    color: var(--ink);
    min-height: 150px;
  }
  .message .line{ display: block; opacity: 0; }
  .message .line.show{ opacity: 1; }
  .cursor{
    display: inline-block;
    width: 2px;
    background: var(--pink-deep);
    margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .flower-row{
    display: flex;
    gap: 20px;
    align-items: flex-end;
    margin-top: 30px;
    height: 140px;
  }
  .flower{
    width: 92px; height: 92px;
    opacity: 0;
    transform: scale(0.2) translateY(10px);
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  .flower.bloom{ opacity: 1; transform: scale(1) translateY(0); }
  .flower:nth-child(1).bloom{ transform: scale(1) translateY(0) rotate(-5deg); }
  .flower:nth-child(2).bloom{ transform: scale(1) translateY(0) rotate(4deg); }
  .flower:nth-child(3).bloom{ transform: scale(1) translateY(0) rotate(-3deg); }

  .finale-wrap{
    position: relative;
    margin-top: 24px;
    display: inline-block;
    cursor: pointer;
  }
  .finale{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 2rem;
    color: var(--pink-deep);
    opacity: 0;
    max-width: 320px;
    line-height: 1.3;
    transition: opacity 0.8s ease;
  }
  .finale.show{ opacity: 1; }
  .finale-underline{
    display: block;
    width: 100%;
    height: 10px;
    opacity: 0;
    transition: opacity 0.8s ease 0.2s;
  }
  .finale-underline.show{ opacity: 1; }

  /* ---------- STAGE 4: SONG PAGE ---------- */
  .song-scene{ width: 240px; }
  .song-message{
    margin-top: 4px;
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: 1.35rem;
    line-height: 1.5;
    color: var(--ink);
    max-width: 300px;
  }
  .song-link{
    margin-top: 16px;
    display: inline-block;
    border: 2.5px solid var(--pink-deep);
    background: var(--cream);
    color: var(--pink-deep);
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 8px 22px;
    border-radius: 225px 15px 255px 15px / 15px 255px 15px 225px;
    text-decoration: none;
    transform: rotate(1.5deg);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .song-link:hover{ background: var(--pink-soft); transform: rotate(0deg); }

  .replay-btn{
    margin-top: 22px;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Kalam', cursive;
    font-size: 0.85rem;
    text-decoration: underline;
    text-decoration-style: wavy;
    text-decoration-color: var(--pink-soft);
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.8s ease, color 0.2s ease;
  }
  .replay-btn.show{ opacity: 1; }
  .replay-btn:hover{ color: var(--pink-deep); }

  .sound-toggle{
    position: fixed;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--pink-soft);
    background: var(--cream);
    box-shadow: 0 4px 14px rgba(224,80,122,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.2s ease;
  }
  .sound-toggle.show{ opacity: 1; }
  .sound-toggle:hover{ transform: scale(1.08) rotate(-6deg); }
</style>
</head>
<body>

<audio id="bg-music" src="hugging-you.mp3" loop preload="auto"></audio>
<button class="sound-toggle" id="sound-toggle" aria-label="toggle music">🔈</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.4/confetti.min.js"></script>

<div class="card">

  <!-- STAGE 1 -->
  <div class="stage active" id="stage-envelope">
    <div class="envelope-label">for Praba 🩷</div>
    <div class="envelope-wrap">
      <div class="washi"></div>
      <div class="envelope" id="envelope">
        <div class="env-letter">tap to open</div>
        <div class="env-body"></div>
        <div class="env-flap"></div>
      </div>
    </div>
    <div class="envelope-hint">go on, open it ~</div>
  </div>

  <!-- STAGE 2 -->
  <div class="stage" id="stage-heart">
    <svg id="heart-svg" viewBox="0 0 300 300"></svg>
    <button class="doodle-btn" id="btn-to-flowers">keep going →</button>
  </div>

  <!-- STAGE 3 -->
  <div class="stage" id="stage-flowers">
    <div class="message-paper">
      <div class="washi-corner"></div>
      <p class="message" id="message"></p>
    </div>
    <div class="flower-row">
      <svg class="flower" id="flower-pink" viewBox="0 0 100 100"></svg>
      <svg class="flower" id="flower-yellow" viewBox="0 0 100 100"></svg>
      <svg class="flower" id="flower-white" viewBox="0 0 100 100"></svg>
    </div>
    <div class="finale-wrap" id="finale-wrap">
      <div class="finale" id="finale">Happy 25th birthday, Praba 🎂</div>
      <svg class="finale-underline" id="finale-underline" viewBox="0 0 260 12" preserveAspectRatio="none">
        <path d="M2 8 Q40 2 80 7 T160 6 T258 8" stroke="var(--pink-soft)" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <button class="doodle-btn" id="btn-to-song">one more thing →</button>
  </div>

  <!-- STAGE 4: song page -->
  <div class="stage" id="stage-song">
    <svg class="song-scene" id="song-scene" viewBox="0 0 260 210"></svg>
    <p class="song-message">I hope i get the chance to count stars with you! ~<br>Your presence feels like the warmth of this song.</p>
    <a class="song-link" href="https://www.youtube.com/watch?v=Cs0upBKec2s&list=RDCs0upBKec2s&start_radio=1" target="_blank" rel="noopener">♪ listen to this song</a>
    <button class="replay-btn" id="btn-replay">play it again</button>
  </div>

</div>

<script>
/* ---------------- ambient doodles: stars, hairclips, ribbon bows ---------------- */
(function ambientDoodles(){
  const starPath = "M6 0 L7.4 4.2 L12 4.2 L8.4 6.8 L9.8 11 L6 8.4 L2.2 11 L3.6 6.8 L0 4.2 L4.6 4.2 Z";
  const clipColors = ['var(--pink)','var(--yellow)','#e8ded0'];
  const bowColors  = ['var(--pink)','var(--pink-deep)'];
  const starColors = ['var(--pink)','var(--yellow)','var(--pink-deep)'];

  function starSvg(color, size){
    return `<svg width="${size}" height="${size}" viewBox="0 0 12 12"><path d="${starPath}" fill="${color}"/></svg>`;
  }
  function clipSvg(color, size){
    return `<svg width="${size*0.7}" height="${size}" viewBox="0 0 20 30">
      <path d="M10 2 C16 2 18 8 17 14 C16 22 12 28 10 28 C8 28 4 22 3 14 C2 8 4 2 10 2 Z" fill="${color}" opacity="0.9"/>
      <rect x="8.5" y="6" width="3" height="16" rx="1.5" fill="var(--cream)" opacity="0.6"/>
    </svg>`;
  }
  function bowSvg(color, size){
    return `<svg width="${size*1.5}" height="${size}" viewBox="0 0 24 16">
      <polygon points="12,8 0,1 0,15" fill="${color}"/>
      <polygon points="12,8 24,1 24,15" fill="${color}"/>
      <circle cx="12" cy="8" r="3" fill="var(--pink-deep)"/>
    </svg>`;
  }

  const generators = [
    () => starSvg(starColors[Math.floor(Math.random()*starColors.length)], 10+Math.random()*8),
    () => clipSvg(clipColors[Math.floor(Math.random()*clipColors.length)], 18+Math.random()*8),
    () => bowSvg(bowColors[Math.floor(Math.random()*bowColors.length)], 12+Math.random()*6)
  ];

  const count = 14;
  for(let i=0;i<count;i++){
    const wrap = document.createElement('div');
    wrap.className = 'sparkle';
    wrap.style.left = Math.random()*100+'vw';
    wrap.style.animationDuration = (11 + Math.random()*10)+'s';
    wrap.style.animationDelay = (Math.random()*12)+'s';
    wrap.innerHTML = generators[i % generators.length]();
    document.body.appendChild(wrap);
  }
})();

/* ---------------- stage control ---------------- */
function goTo(id){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------------- music ---------------- */
const music = document.getElementById('bg-music');
const soundToggle = document.getElementById('sound-toggle');
music.volume = 0.55;

function startMusic(){
  music.play().catch(() => {}); // ignored if autoplay is still blocked
  soundToggle.classList.add('show');
  soundToggle.textContent = '🔊';
}

soundToggle.addEventListener('click', () => {
  if(music.paused){
    music.play();
    soundToggle.textContent = '🔊';
  } else {
    music.pause();
    soundToggle.textContent = '🔇';
  }
});

/* ---------------- STAGE 1: envelope ---------------- */
const envelope = document.getElementById('envelope');
envelope.addEventListener('click', () => {
  if(envelope.classList.contains('open')) return;
  envelope.classList.add('open');
  startMusic();
  setTimeout(() => {
    goTo('stage-heart');
    drawHeart();
  }, 1300);
});

/* ---------------- STAGE 2: heart curve spelling PRABA ---------------- */
function drawHeart(){
  const svg = document.getElementById('heart-svg');
  svg.innerHTML = '';
  const cx = 150, cy = 155, scale = 8.2;
  const points = [];
  const steps = 260;
  for(let i=0;i<=steps;i++){
    const t = (i/steps) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    points.push([cx + x*scale, cy - y*scale]);
  }
  let d = 'M ' + points.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');

  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', d);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', 'var(--pink-deep)');
  path.setAttribute('stroke-width', '3');
  path.setAttribute('stroke-linecap', 'round');
  svg.appendChild(path);

  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.getBoundingClientRect(); // force reflow
  path.style.transition = 'stroke-dashoffset 2.1s ease';
  requestAnimationFrame(() => { path.style.strokeDashoffset = 0; });

  // letters PRABA placed evenly around the curve
  const word = ['P','r','a','b','a'];
  const letterEls = [];
  word.forEach((ch, i) => {
    const t = -Math.PI/2 + i * (Math.PI*2/word.length);
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', cx + x*scale);
    text.setAttribute('y', cy - y*scale);
    text.setAttribute('text-anchor','middle');
    text.setAttribute('class','heart-letter');
    text.textContent = ch;
    svg.appendChild(text);
    letterEls.push(text);
  });

  setTimeout(() => {
    letterEls.forEach((el, i) => {
      setTimeout(() => el.classList.add('show'), i*180);
    });
    setTimeout(() => {
      document.getElementById('btn-to-flowers').classList.add('show');
    }, letterEls.length*180 + 300);
  }, 2100);
}

document.getElementById('btn-to-flowers').addEventListener('click', () => {
  goTo('stage-flowers');
  runFlowerStage();
});

/* ---------------- STAGE 3: message + flowers ---------------- */
const lines = [
  "I don't know what your favorite flower is yet...",
  "But I do remember your favorite colors are Pink, Yellow, and White...",
  "you've said this exactly in chronological order hahaha.",
  "But anywayy,, here are the flowers for you.",
  "I hope you like it."
];

/* daisy: rounded 5-petal bloom (the original design) */
function daisySvg(color, centerColor){
  return `
    <g transform="translate(50,50)">
      ${[0,72,144,216,288].map(a => `
        <ellipse cx="0" cy="-20" rx="11" ry="20" fill="${color}" transform="rotate(${a})"/>
      `).join('')}
      <circle cx="0" cy="0" r="10" fill="${centerColor}"/>
    </g>`;
}

/* tulip: rounded bulb body with three soft top lobes */
function tulipSvg(color, accent){
  return `
    <g transform="translate(50,56)">
      <path d="M0,26 C-12,26 -20,16 -18,4 C-24,4 -26,-8 -18,-14 C-20,-20 -14,-26 -6,-22 C-4,-26 4,-26 6,-22 C14,-26 20,-20 18,-14 C26,-8 24,4 18,4 C20,16 12,26 0,26 Z" fill="${color}"/>
      <path d="M0,22 C-4,10 -4,-6 0,-18" stroke="${accent}" stroke-width="2.5" fill="none" opacity="0.45" stroke-linecap="round"/>
    </g>`;
}

/* pomegranate blossom: narrow pointed petals with a fluffy stamen center */
function pomegranateSvg(color, accent){
  const petals = [0,60,120,180,240,300].map(a => `
    <path d="M0,-4 C-6,-14 -3,-27 0,-31 C3,-27 6,-14 0,-4 Z" fill="${color}" transform="rotate(${a})"/>
  `).join('');
  const stamens = Array.from({length:8}).map((_,i) => {
    const angle = i * (Math.PI/4);
    const x = (Math.cos(angle)*4).toFixed(1);
    const y = (Math.sin(angle)*4).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="1.1" fill="var(--ink)"/>`;
  }).join('');
  return `
    <g transform="translate(50,54)">
      ${petals}
      <circle cx="0" cy="0" r="7" fill="${accent}"/>
      ${stamens}
    </g>`;
}

let flowerStageStarted = false;
function runFlowerStage(){
  if(flowerStageStarted) return;
  flowerStageStarted = true;

  document.getElementById('flower-pink').innerHTML   = daisySvg('var(--pink)', 'var(--yellow)');
  document.getElementById('flower-yellow').innerHTML = daisySvg('var(--yellow)', '#ffffff');
  document.getElementById('flower-white').innerHTML  = daisySvg('#ffffff', 'var(--yellow)');

  const msgEl = document.getElementById('message');
  msgEl.innerHTML = '';
  let lineIndex = 0;

  function typeLine(text, el, cb){
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(document.createTextNode(''));
    el.appendChild(cursor);
    const interval = setInterval(() => {
      cursor.insertAdjacentText('beforebegin', text[i]);
      i++;
      if(i >= text.length){
        clearInterval(interval);
        cursor.remove();
        setTimeout(cb, 420);
      }
    }, 28);
  }

  function nextLine(){
    if(lineIndex >= lines.length){
      setTimeout(showFlowers, 300);
      return;
    }
    const lineEl = document.createElement('span');
    lineEl.className = 'line show';
    msgEl.appendChild(lineEl);
    typeLine(lines[lineIndex], lineEl, () => {
      lineIndex++;
      nextLine();
    });
  }
  nextLine();

  function showFlowers(){
    const order = ['flower-pink','flower-yellow','flower-white'];
    order.forEach((id,i) => {
      setTimeout(() => document.getElementById(id).classList.add('bloom'), i*550);
    });
    setTimeout(() => {
      document.getElementById('finale').classList.add('show');
      document.getElementById('finale-underline').classList.add('show');
      launchConfetti();
    }, order.length*550 + 400);
    setTimeout(() => {
      document.getElementById('btn-to-song').classList.add('show');
    }, order.length*550 + 900);
  }
}

document.getElementById('btn-to-song').addEventListener('click', () => {
  document.getElementById('song-scene').innerHTML = songSceneMarkup();
  goTo('stage-song');
  setTimeout(() => {
    document.getElementById('btn-replay').classList.add('show');
  }, 500);
});

function launchConfetti(){
  if(typeof confetti !== 'function') return;
  const theme = ['#ff6f9c', '#ffc94d', '#ffffff'];
  confetti({ particleCount: 90, spread: 75, origin: { y: 0.6 }, colors: theme });
  setTimeout(() => {
    confetti({ particleCount: 60, angle: 60, spread: 55, origin: { x: 0, y: 0.7 }, colors: theme });
    confetti({ particleCount: 60, angle: 120, spread: 55, origin: { x: 1, y: 0.7 }, colors: theme });
  }, 250);
}

document.getElementById('finale-wrap').addEventListener('click', launchConfetti);

document.getElementById('btn-replay').addEventListener('click', () => {
  envelope.classList.remove('open');
  document.getElementById('message').innerHTML = '';
  document.querySelectorAll('.flower').forEach(f => f.classList.remove('bloom'));
  document.getElementById('finale').classList.remove('show');
  document.getElementById('finale-underline').classList.remove('show');
  document.getElementById('song-scene').innerHTML = '';
  document.getElementById('btn-replay').classList.remove('show');
  document.getElementById('btn-to-flowers').classList.remove('show');
  document.getElementById('btn-to-song').classList.remove('show');
  flowerStageStarted = false;
  music.pause();
  music.currentTime = 0;
  soundToggle.classList.remove('show');
  goTo('stage-envelope');
});
</script>
